name: Build DinMeter firmware

on:
  push:
    branches: [main]
    paths:
      - "DinMeter_Synth_v1.ino"
      - "*.cpp"
      - "*.h"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "DinMeter_Synth_v1.ino"
      - "*.cpp"
      - "*.h"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install M5Stack board package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.2.5

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "M5Unified"

          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/m5stack/M5Unit-8Angle.git "$HOME/Arduino/libraries/M5Unit-8Angle"
          git clone --depth 1 https://github.com/m5stack/M5Unit-ByteButton.git "$HOME/Arduino/libraries/M5Unit-ByteButton"
          git clone --depth 1 https://github.com/m5stack/M5-SAM2695.git "$HOME/Arduino/libraries/M5-SAM2695"

      - name: Prepare sketch
        run: |
          mkdir -p ci-sketch/DinMeter_Synth_v1
          cp DinMeter_Synth_v1.ino ci-sketch/DinMeter_Synth_v1/
          cp *.cpp *.h ci-sketch/DinMeter_Synth_v1/

          git clone --depth 1 https://github.com/enudenki/esp32-usb-host-midi-library.git /tmp/omocha
          find /tmp/omocha/src -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.h" \) -exec cp {} ci-sketch/DinMeter_Synth_v1/ \;

      - name: Read firmware version
        id: firmware
        shell: bash
        run: |
          VERSION=$(grep -oE 'DINMETER_FW_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' SynthApp.cpp | head -n 1 | cut -d= -f2)
          if [ -z "$VERSION" ]; then
            echo "Firmware version marker not found."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_stamp_s3 \
            --build-path build \
            --warnings all \
            ci-sketch/DinMeter_Synth_v1

      - name: Verify compiled firmware marker
        run: |
          grep -a -q "DINMETER_FW_VERSION=${{ steps.firmware.outputs.version }}" build/DinMeter_Synth_v1.ino.bin
          echo "Verified ${{ steps.firmware.outputs.version }} marker in firmware binary."

      - name: Show build outputs
        run: ls -lah build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinmeter-firmware-${{ steps.firmware.outputs.version }}-${{ github.sha }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
          else
            cp build/DinMeter_Synth_v1.ino.bin "DinMeter_Synth_firmware.bin"
            gh release create "$VERSION" \
              "DinMeter_Synth_firmware.bin" \
              --title "DinMeter Synth $VERSION" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
