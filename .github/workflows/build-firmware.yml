name: Build DinMeter firmware

on:
  push:
    branches: [main]
    paths:
      - "DinMeter_Synth_v1.ino"
      - "*.cpp"
      - "*.h"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "DinMeter_Synth_v1.ino"
      - "*.cpp"
      - "*.h"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install M5Stack board package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.2.5

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          # Use the current releases for CI compatibility probing. The gate
          # below prevents unreviewed changes from reaching build artifacts
          # or GitHub Releases, even when the upstream versions move.
          arduino-cli lib install "M5GFX"
          arduino-cli lib install "M5Unified"

          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/m5stack/M5Unit-8Angle.git "$HOME/Arduino/libraries/M5Unit-8Angle"
          git clone --depth 1 https://github.com/m5stack/M5Unit-ByteButton.git "$HOME/Arduino/libraries/M5Unit-ByteButton"
          git clone --depth 1 https://github.com/m5stack/M5-SAM2695.git "$HOME/Arduino/libraries/M5-SAM2695"

      - name: Prepare sketch
        run: |
          mkdir -p ci-sketch/DinMeter_Synth_v1
          cp DinMeter_Synth_v1.ino ci-sketch/DinMeter_Synth_v1/
          cp *.cpp *.h ci-sketch/DinMeter_Synth_v1/

          git clone --depth 1 https://github.com/enudenki/esp32-usb-host-midi-library.git /tmp/omocha
          find /tmp/omocha/src -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.h" \) -exec cp {} ci-sketch/DinMeter_Synth_v1/ \;

      - name: Read firmware version
        id: firmware
        shell: bash
        run: |
          VERSION=$(grep -oE 'DINMETER_FW_VERSION=v[0-9]+\.[0-9]+\.[0-9]+' SynthApp.cpp | head -n 1 | cut -d= -f2)
          if [ -z "$VERSION" ]; then
            echo "Firmware version marker not found."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $VERSION"

      - name: Detect upstream dependency updates before compilation or release
        shell: bash
        run: |
          set -euo pipefail

          # Known-working v1.10.15 baseline. These are REVIEW reference
          # values, not install constraints. Any update stops the CI run
          # until its changelog, breaking changes and device impact are
          # independently reviewed and these values are deliberately revised.
          declare -A reviewed=(
            [M5GFX]="0.3.0"
            [M5Unified]="0.3.0"
            [M5Unit-8Angle]="eb8263555f4563cd5b8b27276869789a5adfa50f"
            [M5Unit-ByteButton]="160e4543606d97b228ba8ac14c5178dd797ac87c"
            [M5-SAM2695]="a83a2f5839eedaca6571ff7bcd72de18f283e77e"
            [esp32-usb-host-midi-library]="d975f96eb076444da4f41b316b766b5dcc201751"
          )

          library_version() {
            local file="$HOME/Arduino/libraries/$1/library.properties"
            test -f "$file" || { echo "::error::Missing library $file"; return 1; }
            sed -n 's/^version=//p' "$file" | tr -d '\r' | head -n 1
          }

          mismatches=0
          check_reviewed() {
            local name="$1" actual="$2"
            echo "$name: actual=$actual reviewed=${reviewed[$name]}"
            if [[ -z "$actual" || "$actual" != "${reviewed[$name]}" ]]; then
              echo "::error::$name changed: actual=$actual, reviewed=${reviewed[$name]}. Review upstream diff/compatibility before approving this update."
              mismatches=1
            fi
          }

          check_reviewed M5GFX "$(library_version M5GFX)"
          check_reviewed M5Unified "$(library_version M5Unified)"
          check_reviewed M5Unit-8Angle "$(git -C "$HOME/Arduino/libraries/M5Unit-8Angle" rev-parse HEAD)"
          check_reviewed M5Unit-ByteButton "$(git -C "$HOME/Arduino/libraries/M5Unit-ByteButton" rev-parse HEAD)"
          check_reviewed M5-SAM2695 "$(git -C "$HOME/Arduino/libraries/M5-SAM2695" rev-parse HEAD)"
          check_reviewed esp32-usb-host-midi-library "$(git -C /tmp/omocha rev-parse HEAD)"

          # M5GFX 0.3.0 introduced a rotation behavior change on DinMeter.
          # Even when dependencies are approved, keep the landscape invariant.
          grep -Fq 'M5.Display.setRotation(0);' SynthApp.cpp
          ! grep -Fq 'M5.Display.setRotation(1);' SynthApp.cpp

          if (( mismatches )); then
            echo "::error::Dependency review required. No firmware artifact or release will be produced."
            exit 1
          fi
          echo "Upstream dependencies match reviewed baseline; build may proceed."

      - name: Compile firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_stamp_s3:PartitionScheme=default_8MB \
            --build-path build \
            --warnings all \
            ci-sketch/DinMeter_Synth_v1

      - name: Verify firmware version
        run: |
          grep -q "DINMETER_FW_VERSION=${{ steps.firmware.outputs.version }}" SynthApp.cpp
          echo "Verified source version: ${{ steps.firmware.outputs.version }}"

      - name: Show build outputs
        run: ls -lah build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: dinmeter-firmware-${{ steps.firmware.outputs.version }}-${{ github.sha }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
          else
            cp build/DinMeter_Synth_v1.ino.bin "DinMeter_Synth_firmware.bin"
            gh release create "$VERSION" \
              "DinMeter_Synth_firmware.bin" \
              --title "DinMeter Synth $VERSION" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
